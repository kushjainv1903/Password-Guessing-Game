<title>Password Guessing Game</title>
<meta name="description" content="A tactile word-guessing game with hints and scoring">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

<style>
/* Design tokens */
:root {
  /* Layout: centered card on warm canvas, max 480px */
  --bg: #FBF9F5;
  --surface: #FFFFFF;
  --text-primary: #1A1A1A;
  --text-secondary: #666666;
  --text-muted: #999999;

  --accent-correct: #059669;
  --accent-present: #D97706;
  --accent-incorrect: #64748B;
  --accent-border: #E5E5E5;

  --tile-bg: #FFFFFF;
  --tile-border: #D4D4D4;
  --tile-shadow: rgba(0, 0, 0, 0.08);

  --radius: 8px;
  --radius-lg: 12px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316;
    --surface: #1C1D21;
    --text-primary: #F5F5F5;
    --text-secondary: #B0B0B0;
    --text-muted: #737373;

    --accent-border: #2A2B2F;

    --tile-bg: #25262B;
    --tile-border: #3A3B40;
    --tile-shadow: rgba(0, 0, 0, 0.3);

    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #121316;
  --surface: #1C1D21;
  --text-primary: #F5F5F5;
  --text-secondary: #B0B0B0;
  --text-muted: #737373;

  --accent-border: #2A2B2F;

  --tile-bg: #25262B;
  --tile-border: #3A3B40;
  --tile-shadow: rgba(0, 0, 0, 0.3);

  color-scheme: dark;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  padding-block: max(env(safe-area-inset-top, 0px), 16px) max(env(safe-area-inset-bottom, 0px), 16px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.3s ease;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

.logo {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 8px 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  transition: all 0.2s ease;
}

.theme-toggle:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 8px var(--tile-shadow);
}

.container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 48px 40px;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 4px 24px var(--tile-shadow);
  transition: background 0.3s ease;
}

.game-title {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 32px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.game-subtitle {
  text-align: center;
  color: var(--text-secondary);
  font-size: 15px;
  margin-bottom: 40px;
}

/* Difficulty selector */
.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}

.diff-btn {
  background: var(--tile-bg);
  border: 2px solid var(--tile-border);
  border-radius: var(--radius);
  padding: 16px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  box-shadow: 0 2px 0 var(--tile-border);
}

.diff-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 0 var(--tile-border);
}

.diff-btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 var(--tile-border);
}

.diff-btn.selected {
  border-color: var(--accent-correct);
  background: var(--accent-correct);
  color: white;
  box-shadow: 0 2px 0 #047857;
}

.diff-btn.selected:hover {
  box-shadow: 0 4px 0 #047857;
}

/* Game board */
.game-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
}

.info-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.info-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 600;
}

.info-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

/* Tile display */
.tiles-container {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
  min-height: 56px;
}

.tile {
  width: 48px;
  height: 56px;
  background: var(--tile-bg);
  border: 2px solid var(--tile-border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 28px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-primary);
  box-shadow: 0 3px 0 var(--tile-border);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  animation: tileEnter 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes tileEnter {
  from {
    transform: scale(0.8);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.tile.correct {
  background: var(--accent-correct);
  border-color: var(--accent-correct);
  color: white;
  box-shadow: 0 3px 0 #047857;
}

.tile.present {
  background: var(--accent-present);
  border-color: var(--accent-present);
  color: white;
  box-shadow: 0 3px 0 #B45309;
}

.tile.empty {
  border-style: dashed;
  color: var(--text-muted);
}

/* Hints */
.hints {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
  min-height: 80px;
}

.hint-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hint-icon {
  font-size: 18px;
}

.hint-text {
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 500;
}

.hint-value {
  color: var(--text-primary);
  font-weight: 700;
}

/* Input */
.guess-input {
  width: 100%;
  padding: 16px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  background: var(--tile-bg);
  border: 2px solid var(--tile-border);
  border-radius: var(--radius);
  color: var(--text-primary);
  margin-bottom: 12px;
  transition: all 0.2s ease;
  text-transform: lowercase;
}

.guess-input:focus {
  outline: none;
  border-color: var(--accent-correct);
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
}

.guess-input.shake {
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

.submit-btn {
  width: 100%;
  padding: 16px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  background: var(--accent-correct);
  color: white;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 3px 0 #047857;
}

.submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 #047857;
}

.submit-btn:active:not(:disabled) {
  transform: translateY(1px);
  box-shadow: 0 1px 0 #047857;
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Victory/Loss screen */
.result-overlay {
  text-align: center;
  padding: 32px 0;
}

.result-icon {
  font-size: 64px;
  margin-bottom: 16px;
}

.result-title {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 24px;
}

.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
}

.stat-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 4px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

.play-again-btn {
  width: 100%;
  padding: 16px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  background: var(--accent-correct);
  color: white;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 3px 0 #047857;
}

.play-again-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 #047857;
}

.play-again-btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 #047857;
}

.error-message {
  color: #DC2626;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  margin-bottom: 16px;
  padding: 12px;
  background: rgba(220, 38, 38, 0.1);
  border-radius: var(--radius);
}

@media (max-width: 480px) {
  .card {
    padding: 32px 24px;
  }

  .game-title {
    font-size: 28px;
  }

  .tile {
    width: 40px;
    height: 48px;
    font-size: 24px;
  }

  .result-stats {
    grid-template-columns: 1fr;
    gap: 12px;
  }
}
</style>

<div class="header">
  <div class="logo">🔐 Password Game</div>
  <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
</div>

<div class="container">
  <div class="card" id="app">
    <h1 class="game-title">Password Game</h1>
    <p class="game-subtitle">Guess the hidden word with tactical hints</p>

    <!-- Difficulty Selection Screen -->
    <div id="difficultyScreen">
      <div class="difficulty-grid">
        <button class="diff-btn" data-difficulty="easy">Easy</button>
        <button class="diff-btn" data-difficulty="medium">Medium</button>
        <button class="diff-btn" data-difficulty="hard">Hard</button>
      </div>
    </div>

    <!-- Game Board Screen -->
    <div id="gameScreen" style="display: none;">
      <div class="game-info">
        <div class="info-item">
          <div class="info-label">Difficulty</div>
          <div class="info-value" id="difficultyDisplay">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">Attempts</div>
          <div class="info-value" id="attemptsDisplay">0/0</div>
        </div>
        <div class="info-item">
          <div class="info-label">Letters</div>
          <div class="info-value" id="lengthDisplay">0</div>
        </div>
      </div>

      <div class="tiles-container" id="tilesContainer"></div>

      <div class="hints" id="hintsContainer">
        <div class="hint-row">
          <span class="hint-icon">💡</span>
          <span class="hint-text">Make your first guess to see hints</span>
        </div>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>

      <input
        type="text"
        class="guess-input"
        id="guessInput"
        placeholder="Type your guess..."
        autocomplete="off"
        spellcheck="false"
      >
      <button class="submit-btn" id="submitBtn">Submit Guess</button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" style="display: none;">
      <div class="result-overlay">
        <div class="result-icon" id="resultIcon">🎉</div>
        <h2 class="result-title" id="resultTitle">You Won!</h2>

        <div class="result-stats">
          <div class="stat-card">
            <div class="stat-label">Password</div>
            <div class="stat-value" id="finalPassword">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Attempts</div>
            <div class="stat-value" id="finalAttempts">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="finalScore">-</div>
          </div>
        </div>

        <button class="play-again-btn" id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
<script>
// API Configuration
const API_BASE = 'http://localhost:8000';

// Game state
let gameState = {
  gameId: null,
  difficulty: null,
  wordLength: 0,
  maxAttempts: 0,
  attemptsUsed: 0,
  isOver: false,
  lastGuess: '',
  positionHint: '',
  correctLettersCount: 0
};

// DOM elements
const difficultyScreen = document.getElementById('difficultyScreen');
const gameScreen = document.getElementById('gameScreen');
const resultScreen = document.getElementById('resultScreen');
const diffButtons = document.querySelectorAll('.diff-btn');
const guessInput = document.getElementById('guessInput');
const submitBtn = document.getElementById('submitBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const themeToggle = document.getElementById('themeToggle');
const errorMessage = document.getElementById('errorMessage');

// Theme toggle
themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  const currentTheme = root.getAttribute('data-theme');

  if (currentTheme === 'dark') {
    root.removeAttribute('data-theme');
  } else if (currentTheme === 'light') {
    root.setAttribute('data-theme', 'dark');
  } else {
    // System preference, toggle to opposite
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', prefersDark ? 'light' : 'dark');
  }
});

// Difficulty selection
diffButtons.forEach(btn => {
  btn.addEventListener('click', async () => {
    const difficulty = btn.dataset.difficulty;

    // Visual feedback
    diffButtons.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    // Start game
    await startGame(difficulty);
  });
});

// Start a new game
async function startGame(difficulty) {
  try {
    const response = await axios.post(`${API_BASE}/game/start`, { difficulty });
    const data = response.data;

    gameState.gameId = data.game_id;
    gameState.difficulty = data.difficulty;
    gameState.wordLength = data.word_length;
    gameState.maxAttempts = data.max_attempts;
    gameState.attemptsUsed = 0;
    gameState.isOver = false;
    gameState.positionHint = '';
    gameState.correctLettersCount = 0;

    // Update UI
    document.getElementById('difficultyDisplay').textContent = difficulty.toUpperCase();
    document.getElementById('attemptsDisplay').textContent = `0/${data.max_attempts}`;
    document.getElementById('lengthDisplay').textContent = data.word_length;

    // Render empty tiles
    renderTiles('');

    // Clear hints
    document.getElementById('hintsContainer').innerHTML = `
      <div class="hint-row">
        <span class="hint-icon">💡</span>
        <span class="hint-text">Make your first guess to see hints</span>
      </div>
    `;

    // Clear input
    guessInput.value = '';
    errorMessage.style.display = 'none';

    // Switch screens
    difficultyScreen.style.display = 'none';
    gameScreen.style.display = 'block';
    resultScreen.style.display = 'none';

    // Focus input
    guessInput.focus();
  } catch (error) {
    showError('Failed to start game. Make sure the backend is running on port 8000.');
  }
}

// Submit a guess
async function submitGuess() {
  const guess = guessInput.value.trim().toLowerCase();

  if (!guess) {
    shakeInput();
    return;
  }

  try {
    submitBtn.disabled = true;
    errorMessage.style.display = 'none';

    const response = await axios.post(
      `${API_BASE}/game/${gameState.gameId}/guess`,
      { guess }
    );
    const result = response.data;

    if (!result.valid) {
      showError(result.message);
      shakeInput();
      submitBtn.disabled = false;
      return;
    }

    // Update state
    gameState.attemptsUsed = result.attempts_used;
    gameState.lastGuess = guess;

    if (result.correct) {
      // Win!
      showResult(true, result);
    } else if (result.is_over) {
      // Loss
      showResult(false, result);
    } else {
      // Continue game
      gameState.positionHint = result.position_hint;
      gameState.correctLettersCount = result.correct_letters_count;

      // Update UI
      document.getElementById('attemptsDisplay').textContent =
        `${result.attempts_used}/${gameState.maxAttempts}`;

      renderTiles(result.position_hint);
      renderHints(result);

      // Clear input
      guessInput.value = '';
      guessInput.focus();
    }

    submitBtn.disabled = false;
  } catch (error) {
    showError('Failed to submit guess. Check your connection.');
    submitBtn.disabled = false;
  }
}

// Render letter tiles
function renderTiles(hint) {
  const container = document.getElementById('tilesContainer');
  container.innerHTML = '';

  for (let i = 0; i < gameState.wordLength; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';

    const char = hint[i] || '_';

    if (char === '_') {
      tile.classList.add('empty');
      tile.textContent = '';
    } else {
      tile.classList.add('correct');
      tile.textContent = char;
    }

    container.appendChild(tile);
  }
}

// Render hints
function renderHints(result) {
  const container = document.getElementById('hintsContainer');
  container.innerHTML = `
    <div class="hint-row">
      <span class="hint-icon">✅</span>
      <span class="hint-text">
        <span class="hint-value">${result.correct_letters_count}</span>
        correct letter${result.correct_letters_count !== 1 ? 's' : ''} in the word
      </span>
    </div>
    <div class="hint-row">
      <span class="hint-icon">📍</span>
      <span class="hint-text">${result.message}</span>
    </div>
  `;
}

// Show result screen
function showResult(isWin, result) {
  gameScreen.style.display = 'none';
  resultScreen.style.display = 'block';

  document.getElementById('resultIcon').textContent = isWin ? '🎉' : '💀';
  document.getElementById('resultTitle').textContent = isWin ? 'You Won!' : 'Game Over';
  document.getElementById('finalPassword').textContent = result.password;
  document.getElementById('finalAttempts').textContent =
    `${result.attempts_used}/${gameState.maxAttempts}`;
  document.getElementById('finalScore').textContent = result.score || 0;
}

// Show error message
function showError(message) {
  errorMessage.textContent = message;
  errorMessage.style.display = 'block';
  setTimeout(() => {
    errorMessage.style.display = 'none';
  }, 3000);
}

// Shake input animation
function shakeInput() {
  guessInput.classList.add('shake');
  setTimeout(() => {
    guessInput.classList.remove('shake');
  }, 400);
}

// Play again
playAgainBtn.addEventListener('click', () => {
  // Reset to difficulty screen
  resultScreen.style.display = 'none';
  difficultyScreen.style.display = 'block';

  // Reset button selection
  diffButtons.forEach(b => b.classList.remove('selected'));
});

// Submit on Enter key
guessInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    submitGuess();
  }
});

// Submit button click
submitBtn.addEventListener('click', submitGuess);
</script>
